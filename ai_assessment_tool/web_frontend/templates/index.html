<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Assessment Tool - Input</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        label { display: block; margin-top: 10px; }
        input[type="text"], input[type="number"], textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea { min-height: 80px; }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
        }
        input[type="submit"]:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <h1>AI Assessment Tool - Project Details</h1>
    <form action="{{ url_for('assess') }}" method="POST">
        <label for="project_name">Project Name:</label>
        <input type="text" id="project_name" name="project_name" required>

        <label for="description">Description:</label>
        <textarea id="description" name="description" required></textarea>

        <label for="market_size">Market Size (e.g., Small, Medium, Large):</label>
        <input type="text" id="market_size" name="market_size">

        <label for="competition">Competition (e.g., Low, Medium, High):</label>
        <input type="text" id="competition" name="competition">

        <label for="initial_investment_usd">Initial Investment (USD):</label>
        <input type="number" id="initial_investment_usd" name="initial_investment_usd" value="0" step="any">

        <label for="revenue_stage">Revenue Stage (e.g., Pre-Revenue, Early-Revenue, Growth):</label>
        <input type="text" id="revenue_stage" name="revenue_stage">

        <label for="team_size">Team Size (Number of people):</label>
        <input type="number" id="team_size" name="team_size" value="0">

        <input type="submit" value="Assess Project (Placeholder)">
    </form>
</body>
</html>
